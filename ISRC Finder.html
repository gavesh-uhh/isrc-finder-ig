<!-- Legacy visual reference only. The production Next.js app uses Spotify for autocomplete and artwork. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISRC Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-2: #111111;
    --border: #222222;
    --border-hover: #333333;
    --text: #ededed;
    --text-dim: #888888;
    --text-dimmer: #555555;
    --accent: #ededed;
    --success: #46a758;
    --success-bg: rgba(70, 167, 88, 0.12);
    --radius: 6px;
    --font: 'Sora', ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff;
      --surface: #fafafa;
      --surface-2: #f5f5f5;
      --border: #eaeaea;
      --border-hover: #d4d4d4;
      --text: #171717;
      --text-dim: #666666;
      --text-dimmer: #999999;
      --accent: #171717;
      --success: #16793f;
      --success-bg: rgba(22, 121, 63, 0.08);
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --surface: #fafafa;
    --surface-2: #f5f5f5;
    --border: #eaeaea;
    --border-hover: #d4d4d4;
    --text: #171717;
    --text-dim: #666666;
    --text-dimmer: #999999;
    --accent: #171717;
    --success: #16793f;
    --success-bg: rgba(22, 121, 63, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }

  body {
    font-family: var(--font);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
    padding: 32px 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }

  .wrap {
    width: 100%;
    max-width: 480px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand svg { flex-shrink: 0; }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    transition: border-color 0.15s, color 0.15s;
  }
  .theme-toggle:hover { border-color: var(--border-hover); color: var(--text); }
  .theme-toggle svg { width: 14px; height: 14px; }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  .field {
    flex: 1;
    position: relative;
  }

  input[type="text"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  input[type="text"]::placeholder { color: var(--text-dimmer); }
  input[type="text"]:focus {
    border-color: var(--border-hover);
    background: var(--surface-2);
  }
  input[type="text"]:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: -1px;
  }

  .quick-fields {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .quick-fields .field input { font-size: 13px; padding: 8px 10px; }

  .suggest-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    overflow: hidden;
    z-index: 20;
    max-height: 320px;
    overflow-y: auto;
    display: none;
  }
  :root[data-theme="light"] .suggest-panel, :root:not([data-theme="dark"]) .suggest-panel {
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .suggest-panel.open { display: block; }

  .suggest-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover, .suggest-item.active { background: var(--surface-2); }

  .suggest-item.top-match { padding: 10px 12px; }

  .suggest-art {
    width: 34px;
    height: 34px;
    border-radius: 4px;
    background: var(--surface-2);
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .suggest-art.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dimmer);
  }
  .suggest-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }

  .suggest-text { min-width: 0; }
  .suggest-title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .suggest-artist {
    font-size: 11.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .suggest-hint {
    font-size: 10px;
    color: var(--text-dimmer);
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }

  .suggest-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 8px 12px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .suggest-toggle:hover { color: var(--text); }
  .suggest-toggle svg { width: 11px; height: 11px; transition: transform 0.15s; }
  .suggest-toggle.expanded svg { transform: rotate(180deg); }

  .suggest-hidden-group { display: none; }
  .suggest-hidden-group.open { display: block; }

  .suggest-status {
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-dimmer);
  }

  .suggest-loading {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
  }
  .suggest-loading.show { display: block; }

  button[type="submit"] {
    background: var(--text);
    color: var(--bg);
    border: 1px solid var(--text);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  button[type="submit"]:hover { opacity: 0.85; }
  button[type="submit"]:active { opacity: 0.7; }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
  button[type="submit"]:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .hint {
    font-size: 12px;
    color: var(--text-dimmer);
    margin: 0 0 20px 2px;
  }

  .status {
    font-size: 13px;
    color: var(--text-dim);
    padding: 24px 4px;
    text-align: center;
  }
  .status.error { color: #e5484d; }

  .results {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 10px 12px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--border-hover); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .card-art {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface-2);
  }

  .card-left { display: flex; gap: 10px; min-width: 0; flex: 1; }

  .card-title {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }

  .card-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.4;
  }

  .card-meta {
    font-size: 11px;
    color: var(--text-dimmer);
    margin-top: 4px;
  }

  .isrc-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .isrc-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 4px 3px 8px;
    font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    color: var(--text);
  }
  .isrc-chip:hover { border-color: var(--border-hover); background: var(--surface); }
  .isrc-chip:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .isrc-chip.copied { border-color: var(--success); background: var(--success-bg); color: var(--success); }

  .isrc-chip .copy-icon {
    width: 12px;
    height: 12px;
    flex-shrink: 0;
    opacity: 0.6;
  }
  .isrc-chip.copied .copy-icon { opacity: 1; }

  .no-isrc {
    font-size: 12px;
    color: var(--text-dimmer);
    font-style: italic;
    margin-top: 8px;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: var(--bg);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
  }
  :root[data-theme="light"] .spinner, :root:not([data-theme="dark"]) .spinner {
    border: 2px solid rgba(0,0,0,0.15);
    border-top-color: var(--bg);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--text);
    color: var(--bg);
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: var(--radius);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      ISRC Finder
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </header>

  <form id="searchForm" autocomplete="off">
    <div class="field" id="mainFieldWrap" style="position: relative;">
      <input type="text" id="mainQuery" placeholder="Start typing a track or artist…" autocomplete="off" autofocus>
      <div class="suggest-loading" id="suggestLoading"><span class="spinner" style="border-top-color: var(--text); border-color: rgba(128,128,128,0.35);"></span></div>
      <div class="suggest-panel" id="suggestPanel"></div>
    </div>
    <button type="submit" id="submitBtn">Search</button>
  </form>
  <p class="hint">Pick a suggestion for instant ISRC, or press Search for full results</p>

  <div class="quick-fields">
    <div class="field"><input type="text" id="artistField" placeholder="Artist (optional)" autocomplete="off"></div>
    <div class="field"><input type="text" id="trackField" placeholder="Track (optional)" autocomplete="off"></div>
  </div>

  <div id="output"></div>
</div>

<div class="toast" id="toast">Copied</div>

<script>
(function() {
  // Paste your Last.fm API key here (get one free at last.fm/api/account/create).
  // Leave blank to fall back to MusicBrainz-only search (still fully functional).
  const LASTFM_API_KEY = '';

  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
  const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

  function systemPrefersDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyIcon(theme) {
    themeIcon.innerHTML = theme === 'dark' ? sunPath : moonPath;
  }
  let current = systemPrefersDark() ? 'dark' : 'light';
  applyIcon(current);
  themeToggle.addEventListener('click', function() {
    current = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', current);
    applyIcon(current);
  });

  const form = document.getElementById('searchForm');
  const mainQuery = document.getElementById('mainQuery');
  const artistField = document.getElementById('artistField');
  const trackField = document.getElementById('trackField');
  const submitBtn = document.getElementById('submitBtn');
  const output = document.getElementById('output');
  const toast = document.getElementById('toast');
  const suggestPanel = document.getElementById('suggestPanel');
  const suggestLoading = document.getElementById('suggestLoading');

  let suggestItems = [];
  let activeIndex = -1;
  let debounceTimer = null;
  let suggestAbort = null;
  let lastQueryToken = 0;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function escapeLucene(s) {
    // Escape Lucene special characters for MusicBrainz search syntax
    return s.replace(/([+\-&|!(){}\[\]^"~*?:\\\/])/g, '\\$1');
  }

  function buildQuery() {
    const artist = artistField.value.trim();
    const track = trackField.value.trim();
    const main = mainQuery.value.trim();

    if (artist || track) {
      const parts = [];
      if (track) parts.push('recording:"' + escapeLucene(track) + '"');
      if (artist) parts.push('artist:"' + escapeLucene(artist) + '"');
      return parts.join(' AND ');
    }
    if (main) {
      // Free text search across recording title / artist
      return main;
    }
    return '';
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function() { toast.classList.remove('show'); }, 1400);
  }

  function copyText(text, chipEl) {
    function done(ok) {
      if (!ok) { showToast('Copy failed'); return; }
      chipEl.classList.add('copied');
      const iconEl = chipEl.querySelector('.copy-icon');
      const prevIcon = iconEl.innerHTML;
      iconEl.innerHTML = '<path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
      showToast('Copied ' + text);
      setTimeout(function() {
        chipEl.classList.remove('copied');
        iconEl.innerHTML = prevIcon;
      }, 1200);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(false); });
    } else {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok);
      } catch (e) { done(false); }
    }
  }

  function formatDate(d) {
    if (!d) return '';
    return d.length >= 4 ? d.slice(0, 4) : d;
  }

  function renderResults(recordings, presetArt) {
    if (!recordings || recordings.length === 0) {
      output.innerHTML = '<div class="status">No recordings found. Try different terms.</div>';
      return;
    }

    const html = recordings.map(function(rec, i) {
      const title = escapeHtml(rec.title || 'Untitled');
      const artists = (rec['artist-credit'] || []).map(function(ac) { return ac.name; }).join(', ');
      const artistsEsc = escapeHtml(artists || 'Unknown artist');
      const artistPlain = (rec['artist-credit'] || []).map(function(ac) { return ac.name; }).join(', ');

      const releases = rec.releases || [];
      let releaseInfo = '';
      if (releases.length > 0) {
        const r = releases[0];
        const bits = [];
        if (r.title && r.title !== rec.title) bits.push(escapeHtml(r.title));
        if (r.date) bits.push(formatDate(r.date));
        if (r.country) bits.push(r.country);
        releaseInfo = bits.join(' · ');
        if (releases.length > 1) releaseInfo += ' · +' + (releases.length - 1) + ' more release' + (releases.length - 1 > 1 ? 's' : '');
      }

      const isrcs = rec.isrcs || [];
      let isrcHtml;
      if (isrcs.length > 0) {
        isrcHtml = '<div class="isrc-row">' + isrcs.map(function(code) {
          const c = escapeHtml(code);
          return '<button type="button" class="isrc-chip" data-isrc="' + c + '" title="Copy ' + c + '">' +
            '<svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
            c + '</button>';
        }).join('') + '</div>';
      } else {
        isrcHtml = '<div class="no-isrc">No ISRC registered for this recording</div>';
      }

      const score = rec.score ? ' · match ' + rec.score + '%' : '';
      const artSlotId = 'card-art-' + i;
      const initialArt = (i === 0 && presetArt) ? presetArt : null;
      const artInner = initialArt
        ? '<img class="card-art" src="' + escapeHtml(initialArt) + '" alt="" loading="lazy">'
        : '<div class="card-art" id="' + artSlotId + '"></div>';

      return '<div class="card" data-title="' + escapeHtml(rec.title || '') + '" data-artist="' + artistsEsc + '">' +
        '<div class="card-top"><div class="card-left">' +
        artInner +
        '<div>' +
        '<div class="card-title">' + title + '</div>' +
        '<div class="card-sub">' + artistsEsc + '</div>' +
        (releaseInfo ? '<div class="card-meta">' + releaseInfo + score + '</div>' : (score ? '<div class="card-meta">' + score.replace(' · ', '') + '</div>' : '')) +
        '</div></div></div>' +
        isrcHtml +
        '</div>';
    }).join('');

    output.innerHTML = '<div class="results">' + html + '</div>';

    output.querySelectorAll('.isrc-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        copyText(chip.getAttribute('data-isrc'), chip);
      });
    });

    if (LASTFM_API_KEY) {
      recordings.forEach(function(rec, i) {
        if (i === 0 && presetArt) return;
        const slot = document.getElementById('card-art-' + i);
        if (!slot) return;
        const title = rec.title || '';
        const artist = ((rec['artist-credit'] || [])[0] || {}).name || '';
        if (!title || !artist) return;
        fetchTrackArt(title, artist).then(function(url) {
          if (url && slot && slot.parentNode) {
            const img = document.createElement('img');
            img.className = 'card-art';
            img.src = url;
            img.alt = '';
            img.loading = 'lazy';
            slot.replaceWith(img);
          }
        });
      });
    }
  }

  async function search(query, presetArt) {
    output.innerHTML = '<div class="status"><span class="spinner"></span>&nbsp;&nbsp;Searching MusicBrainz…</div>';
    submitBtn.disabled = true;

    const url = 'https://musicbrainz.org/ws/2/recording/?query=' + encodeURIComponent(query) +
      '&fmt=json&inc=isrcs+artist-credits+releases&limit=15';

    try {
      const res = await fetch(url, {
        headers: { 'Accept': 'application/json' }
      });
      if (!res.ok) {
        throw new Error('MusicBrainz returned status ' + res.status);
      }
      const data = await res.json();
      renderResults(data.recordings, presetArt || null);
    } catch (err) {
      output.innerHTML = '<div class="status error">Search failed: ' + escapeHtml(err.message) +
        '<br><span style="color:var(--text-dimmer);font-size:11.5px">MusicBrainz may be rate-limiting or unreachable — wait a moment and try again.</span></div>';
    } finally {
      submitBtn.disabled = false;
    }
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    closeSuggestions();
    const q = buildQuery();
    if (!q) {
      output.innerHTML = '<div class="status">Enter a search term above.</div>';
      return;
    }
    search(q);
  });

  // ---------- Last.fm autocomplete ----------

  function closeSuggestions() {
    suggestPanel.classList.remove('open');
    suggestPanel.innerHTML = '';
    suggestItems = [];
    activeIndex = -1;
  }

  const artCache = {};

  function artKey(name, artist) { return (name + '::' + artist).toLowerCase(); }

  async function fetchTrackArt(name, artist) {
    const key = artKey(name, artist);
    if (artCache[key] !== undefined) return artCache[key];
    if (!LASTFM_API_KEY) { artCache[key] = null; return null; }
    try {
      const url = 'https://ws.audioscrobbler.com/2.0/?method=track.getInfo&track=' +
        encodeURIComponent(name) + '&artist=' + encodeURIComponent(artist) +
        '&api_key=' + encodeURIComponent(LASTFM_API_KEY) + '&format=json';
      const res = await fetch(url);
      if (!res.ok) { artCache[key] = null; return null; }
      const data = await res.json();
      const imgs = (data.track && data.track.album && data.track.album.image) || [];
      const large = imgs.find(function(i) { return i.size === 'extralarge'; }) ||
                    imgs.find(function(i) { return i.size === 'large'; }) ||
                    imgs[imgs.length - 1];
      const url2 = large && large['#text'] ? large['#text'] : null;
      artCache[key] = url2 || null;
      return artCache[key];
    } catch (e) {
      artCache[key] = null;
      return null;
    }
  }

  function placeholderArtSvg() {
    return '<div class="suggest-art placeholder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg></div>';
  }

  function renderSuggestions(tracks) {
    if (!tracks || tracks.length === 0) {
      suggestPanel.innerHTML = '<div class="suggest-status">No matches — press Search to try MusicBrainz directly</div>';
      suggestPanel.classList.add('open');
      suggestItems = [];
      activeIndex = -1;
      return;
    }
    suggestItems = tracks;
    activeIndex = -1;

    const top = tracks[0];
    const rest = tracks.slice(1);

    let html = '<div class="suggest-item top-match" data-index="0">' +
      '<div class="suggest-left">' +
      '<div class="suggest-art-slot">' + placeholderArtSvg() + '</div>' +
      '<div class="suggest-text">' +
      '<div class="suggest-title">' + escapeHtml(top.name) + '</div>' +
      '<div class="suggest-artist">' + escapeHtml(top.artist) + '</div>' +
      '</div></div>' +
      '<div class="suggest-hint">Enter</div>' +
      '</div>';

    if (rest.length > 0) {
      html += '<div class="suggest-toggle" id="suggestToggle">' +
        '<span>View hidden (' + rest.length + ')</span>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</div>' +
        '<div class="suggest-hidden-group" id="suggestHiddenGroup">' +
        rest.map(function(t, i) {
          const idx = i + 1;
          return '<div class="suggest-item" data-index="' + idx + '">' +
            '<div class="suggest-left">' +
            '<div class="suggest-art-slot">' + placeholderArtSvg() + '</div>' +
            '<div class="suggest-text">' +
            '<div class="suggest-title">' + escapeHtml(t.name) + '</div>' +
            '<div class="suggest-artist">' + escapeHtml(t.artist) + '</div>' +
            '</div></div>' +
            '<div class="suggest-hint">Enter</div>' +
            '</div>';
        }).join('') +
        '</div>';
    }

    suggestPanel.innerHTML = html;
    suggestPanel.classList.add('open');

    suggestPanel.querySelectorAll('.suggest-item').forEach(function(el) {
      el.addEventListener('mousedown', function(e) {
        e.preventDefault();
        const idx = parseInt(el.getAttribute('data-index'), 10);
        selectSuggestion(idx);
      });
      el.addEventListener('mouseenter', function() {
        setActive(parseInt(el.getAttribute('data-index'), 10));
      });
    });

    const toggleEl = document.getElementById('suggestToggle');
    const hiddenGroup = document.getElementById('suggestHiddenGroup');
    if (toggleEl && hiddenGroup) {
      toggleEl.addEventListener('mousedown', function(e) {
        e.preventDefault();
        const isOpen = hiddenGroup.classList.toggle('open');
        toggleEl.classList.toggle('expanded', isOpen);
        toggleEl.querySelector('span').textContent = isOpen ? 'Hide (' + rest.length + ')' : 'View hidden (' + rest.length + ')';
        if (isOpen) {
          rest.forEach(function(t, i) { loadArtInto(hiddenGroup, i + 1, t); });
        }
      });
    }

    // Load art for the visible top match immediately.
    loadArtInto(suggestPanel, 0, top);
  }

  function loadArtInto(container, idx, track) {
    const el = container.querySelector('.suggest-item[data-index="' + idx + '"] .suggest-art-slot');
    if (!el || el.getAttribute('data-loaded') === '1') return;
    el.setAttribute('data-loaded', '1');
    fetchTrackArt(track.name, track.artist).then(function(url) {
      if (url) {
        el.innerHTML = '<img class="suggest-art" src="' + escapeHtml(url) + '" alt="" loading="lazy">';
      }
    });
  }

  function setActive(idx) {
    activeIndex = idx;
    suggestPanel.querySelectorAll('.suggest-item').forEach(function(el, i) {
      el.classList.toggle('active', i === idx);
    });
    const activeEl = suggestPanel.querySelector('.suggest-item[data-index="' + idx + '"]');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  }

  function selectSuggestion(idx) {
    const t = suggestItems[idx];
    if (!t) return;
    closeSuggestions();
    mainQuery.value = t.name + ' ' + t.artist;
    artistField.value = t.artist;
    trackField.value = t.name;
    const key = artKey(t.name, t.artist);
    const knownArt = artCache[key] || null;
    search('recording:"' + escapeLucene(t.name) + '" AND artist:"' + escapeLucene(t.artist) + '"', knownArt);
  }

  function normalizeKey(s) {
    return s.toLowerCase()
      .replace(/\(feat\.?[^)]*\)/g, '')
      .replace(/\[feat\.?[^\]]*\]/g, '')
      .replace(/feat\.?.*/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  async function fetchLastfmSuggestions(term) {
    const token = ++lastQueryToken;
    suggestLoading.classList.add('show');
    try {
      const url = 'https://ws.audioscrobbler.com/2.0/?method=track.search&track=' +
        encodeURIComponent(term) + '&api_key=' + encodeURIComponent(LASTFM_API_KEY) +
        '&format=json&limit=30';
      const res = await fetch(url);
      if (token !== lastQueryToken) return; // stale response, a newer query superseded it
      if (!res.ok) throw new Error('status ' + res.status);
      const data = await res.json();
      const matches = (data.results && data.results.trackmatches && data.results.trackmatches.track) || [];
      const list = Array.isArray(matches) ? matches : [matches];

      const cleaned = list
        .filter(function(t) { return t && t.name && t.artist; })
        .map(function(t) {
          return {
            name: t.name,
            artist: t.artist,
            listeners: parseInt(t.listeners, 10) || 0
          };
        });

      // Dedupe near-identical title+artist pairs (remixes/versions of the same
      // core track from different uploaders), keeping the one with more listeners.
      const byKey = {};
      cleaned.forEach(function(t) {
        const key = normalizeKey(t.name) + '|' + normalizeKey(t.artist);
        if (!byKey[key] || t.listeners > byKey[key].listeners) {
          byKey[key] = t;
        }
      });

      // Rank by listener count (popularity) rather than Last.fm's raw text-match order.
      const ranked = Object.values(byKey)
        .sort(function(a, b) { return b.listeners - a.listeners; })
        .slice(0, 8);

      renderSuggestions(ranked);
    } catch (err) {
      if (token !== lastQueryToken) return;
      suggestPanel.innerHTML = '<div class="suggest-status">Live suggestions unavailable — press Search to look up directly</div>';
      suggestPanel.classList.add('open');
      suggestItems = [];
    } finally {
      if (token === lastQueryToken) suggestLoading.classList.remove('show');
    }
  }

  mainQuery.addEventListener('input', function() {
    const val = mainQuery.value.trim();
    clearTimeout(debounceTimer);
    if (!LASTFM_API_KEY) {
      closeSuggestions();
      return;
    }
    if (val.length < 2) {
      closeSuggestions();
      return;
    }
    debounceTimer = setTimeout(function() {
      fetchLastfmSuggestions(val);
    }, 280);
  });

  mainQuery.addEventListener('keydown', function(e) {
    if (!suggestPanel.classList.contains('open') || suggestItems.length === 0) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive(Math.min(activeIndex + 1, suggestItems.length - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive(Math.max(activeIndex - 1, 0));
    } else if (e.key === 'Enter') {
      if (activeIndex >= 0) {
        e.preventDefault();
        selectSuggestion(activeIndex);
      }
    } else if (e.key === 'Escape') {
      closeSuggestions();
    }
  });

  document.addEventListener('click', function(e) {
    if (!document.getElementById('mainFieldWrap').contains(e.target)) {
      closeSuggestions();
    }
  });
})();
</script>
</body>
</html>
